  <main>
    <h1>週報システム</h1>
    <p>研究室の中で使う、日報と週報の作成を手伝うツールです。メンバーが Slack で書いた日報をもとに、研究室のサーバーで週報のスライドを作り、Google ドライブに保存して共有します。</p>
    <p>研究室のメンバーだけが使うためのもので、一般には提供していません。</p>
    <h2>Google のデータの扱い</h2>
    <p>Google ドライブには、このツールが作ったファイルだけを読み書きする権限（<code>drive.file</code>）でアクセスします。それ以外のファイルを見ることはありません。詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください。</p>
    <h2>問い合わせ</h2>
    <!-- 公開前に、このシステム専用の Google アカウントのアドレスに置き換える -->
    <p>Contact: rprtweekly@gmail.com</p>
  </main>
